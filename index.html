<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wildlife Ecology – MCQ Practice</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--text:#1d2420;--muted:#66706a;--line:#dfe3dc;--accent:#2f6b4f;--accent-d:#245640;--ok:#1d7a46;--okbg:#e3f4ea;--bad:#b3261e;--badbg:#fbe7e5}
@media (prefers-color-scheme:dark){:root{--bg:#141815;--card:#1d231f;--text:#e8ece9;--muted:#9aa59e;--line:#313a34;--accent:#58b389;--accent-d:#74c7a0;--ok:#5fd18f;--okbg:#17332480;--bad:#ff8b82;--badbg:#3a1b1980}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:600}
.btn:hover{background:var(--accent-d)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.mode{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px;color:var(--text)}
.mode:hover{border-color:var(--accent)}
.mode b{display:block}.mode span{color:var(--muted);font-size:.9rem}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.tag{display:inline-block;font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 9px;margin-bottom:10px}
.q{font-size:1.1rem;font-weight:600;margin:0 0 14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt.correct{border-color:var(--ok);background:var(--okbg)}
.opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default;color:var(--text)}
.fb{min-height:24px;font-weight:600;margin:4px 0 0}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.score{font-size:2.4rem;font-weight:800;margin:6px 0}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev p{margin:0 0 4px}.rev .y{color:var(--ok)}.rev .n{color:var(--bad)}
.hint{color:var(--muted);font-size:.8rem;margin-top:14px}
</style>
</head>

ies that", "o": ["Occupy only one climax community", "Have identical population size", "Utilise resources in a similar way", "Are confined to saline habitats"], "a": 2}, {"w": 6, "q": "The climax near Tindni village is being controlled by disturbance by cattle. This is an example of", "o": ["climatic climax", "edaphic climax", "disclimax", "catastrophic climax"], "a": 2}, {"w": 6, "q": "Species abundance may be expressed in terms of", "o": ["Climate, soil and slope", "Number of individuals, biomass or cover", "Hydrosere, xerosere and halosere", "Resistance, resilience and stability"], "a": 1}, {"w": 6, "q": "Resistance refers to the ability of a community to", "o": ["Recover quickly after disturbance", "Persist without change in the face of disturbance", "Increase the number of pioneer species", "Replace one seral stage with another"], "a": 1}, {"w": 6, "q": "Importance value can be written as", "o": ["Relative density + Relative frequency X Relative dominance", "Relative density X Relative frequency + Relative dominance", "Relative density + Relative frequency + Relative dominance", "Relative density X Relative frequency X Relative dominance"], "a": 2}, {"w": 6, "q": "Secondary succession refers to succession that occurs", "o": ["On newly exposed rock or sand surfaces", "In a saline body such as a marsh", "After severe disturbance or removal of a pre-existing community", "Only when climate controls the final community"], "a": 2}, {"w": 6, "q": "Lithosere is an example of", "o": ["hydrosere", "xerosere", "psammosere", "halosere"], "a": 1}, {"w": 6, "q": "A transition area where two communities meet and integrate is called", "o": ["Habitat", "Niche", "Ecotone", "Sere"], "a": 2}, {"w": 6, "q": "Which of these is correct?", "o": ["Fundamental niche > Realised niche", "Fundamental niche = Realised niche", "Fundamental niche < Realised niche", "Either Fundamental niche > Realised niche, or Fundamental niche = Realised niche"], "a": 3}, {"w": 6, "q": "Species richness ref ments of size", "o": ["> 20 mm", "5 - 20 mm", "< 5 mm", "< 1 mm"], "a": 1}, {"w": 12, "q": "Which level is formed when similar cells and their extracellular matrix from the same origin together perform a specific function?", "o": ["Organ", "Tissue", "Organ system", "Population"], "a": 1}, {"w": 12, "q": "Secondary succession refers to succession that occurs", "o": ["On newly exposed rock or sand surfaces", "In a saline body such as a marsh", "After severe disturbance or removal of a pre-existing community", "Only when climate controls the final community"], "a": 2}, {"w": 12, "q": "A group of organs working together to perform one or more functions is called?", "o": ["Tissue", "Organ", "Organism", "Organ system"], "a": 3}, {"w": 12, "q": "After a forest fire, an incompletely destroyed forest develops through herbaceous, shrub and woodland stages toward a stable stage. This is best described as?", "o": ["Secondary succession", "Climatic climax", "Bioaccumulation", "Species-area effect"], "a": 0}, {"w": 12, "q": "If organisms already present in an area change the soil conditions and thereby drive further community change, the succession is?", "o": ["Allogenic succession", "Autogenic succession", "Catastrophic succession", "Seasonal succession"], "a": 1}];
const LETTERS = ["A","B","C","D"];
const PIN_LAST = /^(none of these|all of the above)/i;
const app = document.getElementById("app");

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// Each question is rebuilt from the bank on every run; the correct option is tracked by flag, not by position.
function prepare(items){
  return shuffle(items).map(it=>{
    const opts = it.o.map((t,i)=>({t, c:i===it.a}));
    const pinned = opts.filter(o=>PIN_LAST.test(o.t));
    const rest = shuffle(opts.filter(o=>!PIN_LAST.test(o.t)));
    return {w:it.w, q:it.q, opts:[...rest,...pinned]};
  });
}

let test=[], idx=0, score=0, wrong=[], answered=false;

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==="class")e.className=v; else if(k.startsWith("on"))e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const kid of kids){ e.append(kid); }
  return e;
}

function home(){
  app.replaceChildren(
    el("h1",{},"Wildlife Ecology – MCQ Practice"),
    el("p",{class:"sub"},"Weeks 1–12 · 120 questions in the bank · order and options reshuffle every time"),
    el("div",{class:"card"},
      el("b",{},"Choose a test"),
      el("button",{class:"mode",onclick:()=>start(75)}, el("b",{},"75 questions"), el("span",{},"Random 75 from all 12 weeks")),
      el("button",{class:"mode",onclick:()=>start(120)}, el("b",{},"All 120 questions"), el("span",{},"Full bank, everything shuffled")),
      el("p",{class:"hint"},"Shortcuts: press A–D (or 1–4) to answer, Enter or → for next question.")
    )
  );
}

function start(n){
  const pool = n>=BANK.length ? BANK : shuffle(BANK).slice(0,n);
  test = prepare(pool); idx=0; score=0; wrong=[]; show();
}

function show(){
  answered=false;
  const q=test[idx];
  const fb=el("p",{class:"fb"});
  const next=el("button",{class:"btn",disabled:"",onclick:advance}, idx===test.length-1?"Finish":"Next");
  next.id="next";
  const optEls=q.opts.map((o,i)=>{
    const b=el("button",{class:"opt",onclick:()=>choose(i)}, el("span",{class:"k"},LETTERS[i]), el("span",{},o.t));
    return b;
  });
  const bar=el("div",{class:"bar"}); const fill=el("i"); fill.style.width=(idx/test.length*100)+"%"; bar.append(fill);
  app.replaceChildren(
    el("div",{class:"top"}, el("span",{},`Question ${idx+1} / ${test.length}`), el("span",{},`Score: ${score}`)),
    bar,
    el("div",{class:"card"},
      el("span",{class:"tag"},`Week ${q.w}`),
      el("p",{class:"q"},q.q),
      ...optEls, fb,
      el("div",{class:"row"},next)
    )
  );
  app._opts=optEls; app._fb=fb; app._next=next;
}

function choose(i){
  if(answered) return; answered=true;
  const q=test[idx], picked=q.opts[i];
  app._opts.forEach((b,j)=>{
    b.disabled=true;
    if(q.opts[j].c) b.classList.add("correct");
    else if(j===i) b.classList.add("wrong");
  });
  if(picked.c){ score++; app._fb.textContent="Correct ✓"; app._fb.className="fb ok"; }
  else { wrong.push({w:q.w,q:q.q,yours:picked.t,right:q.opts.find(o=>o.c).t,src:q}); app._fb.textContent="Incorrect ✗ — correct answer is highlighted"; app._fb.className="fb bad"; }
  app._next.disabled=false; app._next.focus();
}

function advance(){
  if(!answered) return;
  idx++; if(idx>=test.length) finish(); else show();
}

function finish(){
  const pct=Math.round(score/test.length*100);
  const card=el("div",{class:"card"},
    el("div",{},"Your score"),
    el("div",{class:"score"},`${score} / ${test.length}  (${pct}%)`),
    el("div",{class:"row"},
      el("button",{class:"btn",onclick:home},"New shuffled test"),
      wrong.length?el("button",{class:"btn ghost",onclick:retryWrong},`Retry ${wrong.length} wrong`):""
    )
  );
  if(wrong.length){
    card.append(el("h3",{},"Review mistakes"));
    wrong.forEach(w=>card.append(el("div",{class:"rev"},
      el("p",{},el("b",{},`[Wk ${w.w}] `),w.q),
      el("p",{class:"n"},"Your answer: "+w.yours),
      el("p",{class:"y"},"Correct: "+w.right))));
  }
  app.replaceChildren(el("h1",{},"Test complete"),card);
}

function retryWrong(){
  const items=wrong.map(w=>{
    const o=w.src.opts; return {w:w.w,q:w.q,o:o.map(x=>x.t),a:o.findIndex(x=>x.c)};
  });
  test=prepare(items); idx=0; score=0; wrong=[]; show();
}

document.addEventListener("keydown",e=>{
  if(!test.length||!app._opts||!document.getElementById("next")) return;
  const k=e.key.toLowerCase();
  const map={a:0,b:1,c:2,d:3,"1":0,"2":1,"3":2,"4":3};
  if(k in map && !answered && map[k]<test[idx].opts.length) choose(map[k]);
  else if((k==="enter"||k==="arrowright") && answered){ e.preventDefault(); advance(); }
});

home();
</script>
